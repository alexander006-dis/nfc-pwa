<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тот самый кусочек</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FFA4A6; /* Точный розовый цвет фона */
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 25px 16px;
    }

    /* Контейнер для картинки-заголовка */
    .header-image-container {
      width: 100%;
      max-width: 360px;
      margin-bottom: 25px;
      display: flex;
      justify-content: center;
    }

    .header-image-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Кнопка установки PWA — яркая, привлекающая внимание */
    #installBtn {
      display: none;
      width: 100%;
      max-width: 360px;
      background-color: #E25D65;
      color: #FFF275;
      border: none;
      padding: 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(226, 93, 101, 0.3);
      text-transform: uppercase;
    }

    /* Контейнер списка кнопок */
    .links-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Абсолютно точная копия кнопок с тильды */
    .menu-button {
      display: flex;
      align-items: center;
      background-color: #FFE677; /* Точный пастельно-желтый цвет кнопок */
      color: #D6545A; /* Точный цвет текста */
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 20px; /* Фирменное скругление */
      font-size: 16px;
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      transition: transform 0.1s ease;
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    /* Стили для круглых иконок слева */
    .icon-wrapper {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      margin-right: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #FFF;
    }

    /* Иконка Телеграма — кастомный розовый фон */
    .icon-wrapper.tg-bg {
      background-color: #FFA4A6;
    }

    /* Иконка MAX — точно как на скрине */
    .icon-wrapper.max-bg {
      background-color: #FFA4A6;
    }

    .icon-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .icon-wrapper svg {
      width: 22px;
      height: 22px;
      fill: #FFF;
    }
  </style>
</head>
<body>

  <!-- Заголовок-картинка -->
  <div class="header-image-container">
    <!-- Замените header.png на имя вашего файла с картинкой текста -->
    <img src="header.png" alt="Тот самый кусочек, который можно!">
  </div>

  <!-- Кнопка добавления PWA -->
  <button id="installBtn">✨ Добавить на рабочий стол</button>

  <!-- Список кнопок -->
  <div class="links-container">
    
    <!-- 1. О проекте (с аватаркой) -->
    <a href="#" class="menu-button">
      <div class="icon-wrapper">
        <img src="avatar.png" alt="О проекте">
      </div>
      <span>О проекте</span>
    </a>

    <!-- 2. Перейти в канал MAX -->
    <a href="ССЫЛКА_НА_КАНАЛ_MAX" class="menu-button">
      <div class="icon-wrapper max-bg">
        <!-- SVG-копия иконки Q со скриншота -->
        <svg viewBox="0 0 24 24" style="width:24px; height:24px;">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c2.31 0 4.43-.79 6.13-2.1l2.58 2.58 1.41-1.41-2.58-2.58C21.21 16.43 22 14.31 22 12 22 6.48 17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
        </svg>
      </div>
      <span>Перейти в канал MAX</span>
    </a>

    <!-- 3. Перейти в канал Telegram -->
    <a href="ССЫЛКА_НА_КАНАЛ_ТГ" class="menu-button">
      <div class="icon-wrapper tg-bg">
        <!-- Нативный SVG самолетика Телеграм -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.24-5.54 3.65-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.35-.49.97-.74 3.79-1.65 6.32-2.74 7.57-3.27 3.61-1.53 4.36-1.8 4.85-1.8.11 0 .35.03.5.16.13.12.17.29.18.41 0 .08-.01.24-.02.32z"/>
        </svg>
      </div>
      <span>Перейти в канал Telegram</span>
    </a>

    <!-- 4. Написать в MAX -->
    <a href="ССЫЛКА_НА_ЛИЧКУ_MAX" class="menu-button">
      <div class="icon-wrapper max-bg">
        <svg viewBox="0 0 24 24" style="width:24px; height:24px;">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c2.31 0 4.43-.79 6.13-2.1l2.58 2.58 1.41-1.41-2.58-2.58C21.21 16.43 22 14.31 22 12 22 6.48 17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
        </svg>
      </div>
      <span>Написать в MAX</span>
    </a>

    <!-- 5. Написать в Telegram -->
    <a href="ССЫЛКА_НА_ЛИЧКУ_ТГ" class="menu-button">
      <div class="icon-wrapper tg-bg">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.24-5.54 3.65-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.35-.49.97-.74 3.79-1.65 6.32-2.74 7.57-3.27 3.61-1.53 4.36-1.8 4.85-1.8.11 0 .35.03.5.16.13.12.17.29.18.41 0 .08-.01.24-.02.32z"/>
        </svg>
      </div>
      <span>Написать в Telegram</span>
    </a>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => console.log('PWA Ready'));
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
