<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тот самый кусочек</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FFA4A6; /* Точный розовый цвет фона лендинга */
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 25px 16px;
    }

    /* Контейнер для картинки-заголовка */
    .header-image-container {
      width: 100%;
      max-width: 360px;
      margin-bottom: 25px;
      display: flex;
      justify-content: center;
    }

    .header-image-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Кнопка установки PWA приложения */
    #installBtn {
      display: none;
      width: 100%;
      max-width: 360px;
      background-color: #E25D65;
      color: #FFF275;
      border: none;
      padding: 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(226, 93, 101, 0.3);
      text-transform: uppercase;
    }

    /* Контейнер списка кнопок */
    .links-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Кнопки меню */
    .menu-button {
      display: flex;
      align-items: center;
      background-color: #FFE677; /* Пастельно-желтый цвет кнопок */
      color: #D6545A; /* Цвет текста */
      text-decoration: none;
      padding: 10px 10px;
      border-radius: 14px; /* Фирменное скругление углов */
      font-size: 16px;
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      transition: transform 0.1s ease;
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    /* Круглые обертки для иконок */
    .icon-wrapper {
      width: 45px;
      height: 45px;
      border-radius: 10px;
      margin-right: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .icon-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Заголовок-картинка -->
  <div class="header-image-container">
    <img src="header.svg" alt="Тот самый кусочек, который можно!">
  </div>

  <!-- Кнопка добавления PWA -->
  <button id="installBtn">✨ Установить приложение</button>

  <!-- Список кнопок-ссылок -->
  <div class="links-container">
    
    <!-- 1. О проекте -->
    <a href="https://kusocheck.tilda.ws/about" class="menu-button">
      <div class="icon-wrapper">
        <img src="avatar.png" alt="О проекте">
      </div>
      <span>О проекте</span>
    </a>

    <!-- 2. Перейти в канал MAX -->
    <a href="https://max.ru/join/kjBzdsUw-AxrClbyV6wHlF8yG3xwOyOMsel1unNcpEg" class="menu-button">
      <div class="icon-wrapper">
        <img src="max-icon.svg" alt="MAX">
      </div>
      <span>Перейти в канал MAX</span>
    </a>

    <!-- 3. Перейти в канал Telegram -->
    <a href="tg://resolve?domain=polly_cooking333" class="menu-button">
      <div class="icon-wrapper">
        <img src="telegram-icon.svg" alt="Telegram">
      </div>
      <span>Перейти в канал Telegram</span>
    </a>

    <!-- 4. Написать в MAX -->
    <a href="https://max.ru/u/f9LHodD0cOIpsnHNiVg0e7Ktoi40W-WrrBSPKi7OC0qfK9DxPsZQTyaP-GQ" class="menu-button">
      <div class="icon-wrapper">
        <img src="max-icon.svg" alt="MAX">
      </div>
      <span>Написать в MAX</span>
    </a>

    <!-- 5. Написать в Telegram -->
    <a href="tg://resolve?domain=Polly_cooking" class="menu-button">
      <div class="icon-wrapper">
        <img src="telegram-icon.svg" alt="Telegram">
      </div>
      <span>Написать в Telegram</span>
    </a>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => console.log('PWA Active'));
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
